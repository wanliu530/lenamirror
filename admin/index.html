<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Editor</title>
  <!-- CDN加载资源，避免本地文件404 -->
  <link rel="stylesheet" href="https://unpkg.com/decap-cms@3.1.10/dist/decap-cms.css">
</head>
<body>
<script src="https://unpkg.com/decap-cms@3.1.10/dist/decap-cms.js"></script>
<script>
CMS.init({
  config: {
    backend: {
      name: "github",
      repo: "wanliu530/lenamirror",
      branch: "main",
      auth_scope: "repo"
    },
    media_folder: "assets/upload",
    public_folder: "/assets/upload",
    collections: [
      {
        name: "journal",
        label: "随笔 Journal",
        folder: "content/journal",
        create: true,
        slug: "{{year}}-{{month}}-{{day}}-{{title}}",
        fields: [
          { label: "标题", name: "title", widget: "string" },
          { label: "发布日期", name: "date", widget: "datetime" },
          { label: "正文内容（支持图片插入）", name: "body", widget: "markdown" }
        ]
      },
      {
        name: "gallery",
        label: "Gallery 相册",
        folder: "content/gallery",
        create: true,
        slug: "{{albumId}}",
        fields: [
          {
            label: "相册分类",
            name: "albumId",
            widget: "select",
            options: [
              { label: "Daily Life", value: "dailylife" },
              { label: "Portrait", value: "portrait" },
              { label: "刘咪", value: "liumi" }
            ]
          },
          { label: "照片简介", name: "caption", widget: "text", required: false },
          { label: "照片文件", name: "photo", widget: "image" }
        ]
      }
    ]
  }
})
</script>
</body>
</html>
