backend:
  name: git-gateway
  branch: main

media_folder: "assets/upload"
public_folder: "/assets/upload"

collections:
  - name: journal
    label: "随笔 Journal"
    folder: "content/journal"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime" }
      - { label: "正文内容（支持图片插入）", name: "body", widget: "markdown" }

  - name: gallery
    label: Gallery 相册
    folder: content/gallery
    create: true
    delete: true
    fields:
      - label: "相册分类"
        name: album_category
        widget: select
        options:
          - { label: "Daily Life", value: "Daily Life" }
          - { label: "这是人", value: "这是人" }
          - { label: "刘咪", value: "刘咪" }
      - label: "照片简介(可选)"
        name: desc
        widget: text
        required: false
      - label: "照片文件"
        name: image
        widget: image