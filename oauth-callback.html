<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>授权完成</title>
</head>
<body>
<script>
(function(){
  const hash = location.hash;
  const targetUrl = "https://lenamirror.pages.dev/admin" + hash;
  // 判断是否存在父窗口
  if(window.opener && !window.opener.closed){
    window.opener.location.href = targetUrl;
  }else{
    // 没有父窗口，直接新开标签跳转后台
    window.location.href = targetUrl;
  }
  setTimeout(()=> window.close(), 600);
})();
</script>
</body>
</html>
