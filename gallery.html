<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✧⋆ Memories Gallery ˚‧₊˚✧⋆</title>
    <style>
        /* ====================== 独立字体 仅woff2 ====================== */
        @font-face {
            font-family: "Font_SiteTitle";
            src: url("./assets/fonts/font_title.woff2") format("woff2");
            font-weight: normal;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Nav_EN";
            src: url("./assets/fonts/font_body_en.woff2") format("woff2");
            unicode-range: U+0000-007F, U+00A0-00FF, U+2000-206F;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Nav_CN";
            src: url("./assets/fonts/font_body_cn.woff2") format("woff2");
            unicode-range: U+4E00-9FFF, U+3000-303F, U+FF00-FFEF;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Body_EN";
            src: url("./assets/fonts/font_body_en.woff2") format("woff2");
            unicode-range: U+0000-007F, U+00A0-00FF, U+2000-206F;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Body_CN";
            src: url("./assets/fonts/font_body_cn.woff2") format("woff2");
            unicode-range: U+4E00-9FFF, U+3000-303F, U+FF00-FFEF;
            font-display: swap;
        }
        /* ====================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url("./assets/images/cursor_pixel.gif"), auto;
        }
        body {
            font-family: "Font_Body_EN", "Font_Body_CN", sans-serif;
            overflow-x: hidden;
            background: #fff5fb;
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03' fill='%23ff99cc'/%3E%3C/svg%3E");
        }
        a:hover, button:hover, .album-window:hover {
            cursor: url("./assets/images/cursor_pixel.gif"), pointer;
        }
        .nav-link {
            font-family: "Font_Nav_EN", "Font_Nav_CN", sans-serif;
        }
        .y2k-neon-panel {
            border: 3px solid #ff77bb;
            box-shadow:
                0 0 10px #ff77bb40,
                0 0 20px #ffbbee30,
                inset 0 0 12px #ffcce020;
            backdrop-filter: blur(3px);
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: transparent;
        }
        .y2k-neon-panel::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #ffc0e850, transparent);
            animation: soft-scan 3.5s linear infinite;
        }
        @keyframes soft-scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        /* 顶部横幅 */
        .top-cat-banner {
            width: 100%;
            height: 440px;
            background: url("./assets/images/cat-banner.jpg") center/cover no-repeat;
            position: relative;
            padding: 30px;
            overflow: hidden;
            border-bottom: 4px solid transparent;
            border-image: linear-gradient(90deg, #ff77bb, #ffbbee) 1;
        }
        .float-sticker {
            position: absolute;
            pointer-events: none;
            animation: slow-float 6s ease-in-out infinite;
            filter: drop-shadow(0 0 6px #ffbbee);
        }
        .sticker-butterfly { top: 20px; left: 10%; width: 180px; animation-delay: 0.5s; }
        .sticker-daisy { top: 60px; left: 75%; width: 70px; animation-delay: 1.2s; }
        .sticker-heart { bottom: 80px; left: 20%; width: 100px; animation-delay: 2s; }
        @keyframes slow-float {
            0% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-16px) rotate(3deg); }
            100% { transform: translateY(0) rotate(-3deg); }
        }
        .site-title-glitter {
            position: absolute;
            right: 40px;
            bottom: 30px;
            font-size: 74px;
            font-family: "Font_SiteTitle";
            font-weight: 950;
            letter-spacing: 5px;
            font-style: italic;
            color: #b81e60;
            animation: title-shine 1.4s infinite alternate;
            text-shadow:
                3px 3px 0 #ffffff,
                -1px -1px 0 #fff,
                1px -1px 0 #fff,
                -1px 1px 0 #fff,
                0 0 14px #ff4488,
                0 0 28px #c82266,
                0 0 42px #a01850;
            transform: rotate(-2deg);
        }
        .star-deco-left {
            position: absolute;
            right: calc(100% + 12px);
            top: 10px;
            font-size: 32px;
            color: #fff;
            text-shadow: 0 0 10px #ffdd66;
            animation: star-blink 0.8s infinite alternate;
        }
        .star-deco-right {
            position: absolute;
            left: calc(100% + 12px);
            bottom: 8px;
            font-size: 32px;
            color: #fff;
            text-shadow: 0 0 10px #ffdd66;
            animation: star-blink 0.8s infinite alternate 0.4s;
        }
        @keyframes star-blink {
            from { opacity: 0.5; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1.2); }
        }
        @keyframes title-shine {
            from { filter: drop-shadow(0 0 6px #ff99cc); }
            to { filter: drop-shadow(0 0 22px #b81e60); }
        }
        /* 主体布局 */
        .content-container {
            display: flex !important;
            flex-direction: row !important;
            align-items: flex-start;
            width: 92%;
            max-width: 1420px;
            margin: 45px auto;
            gap: 40px;
        }
        .left-sidebar-wrap {
            flex-shrink: 0 !important;
            width: 230px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .sidebar-nav {
            width: 100%;
            padding: 32px 22px;
            z-index: 10;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 30px 0;
            text-decoration: none;
            font-size: 22px;
            color: #801048 !important;
            font-weight: bold;
            transition: all 0.2s;
            padding: 8px 10px;
            border-radius: 6px;
        }
        .nav-link:hover {
            transform: translateX(6px);
            color: #ff2277 !important;
        }
        .nav-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }
        .main-content-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 100%;
        }
        /* ========== 相册顶部标题 ========== */
        .gallery-header-block {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 36px;
            flex-wrap: wrap;
            padding: 20px 0;
        }
        .gallery-header-img {
            max-width: 320px;
            max-height: 260px;
            object-fit: contain;
            display: block;
        }
        .gallery-main-title {
            font-family: "Font_SiteTitle";
            font-size: 52px;
            color: #b81e60;
            letter-spacing: 4px;
            animation: title-shine 2s infinite alternate;
        }
        /* 分割线 */
        .divider-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            width: 100%;
        }
        .divider-gif {
            object-fit: contain;
        }
        .divider-side {
            width: 37%;
            height: 60px;
        }
        .divider-center {
            width: 40%;
            height: 68px;
        }
        /* 相册网格 */
        .album-grid-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 32px;
            width: 100%;
        }
        .album-window {
            background: #fdf4ff;
            border: 3px solid #e9c5ff;
            border-radius: 18px;
            box-shadow:
                0 0 18px #ff99ff50,
                0 0 35px #dd88ff35;
            overflow: hidden;
            position: relative;
            transition: transform 0.2s ease;
        }
        .album-window:hover {
            transform: translateY(-6px);
            box-shadow: 0 0 24px #ff88ff70;
        }
        .album-win-titlebar {
            background: linear-gradient(90deg, #e2a8ff, #ff99cc, #e2a8ff);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .album-win-name {
            font-family: "Font_SiteTitle";
            color: white;
            font-size: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 6px #ff77bb;
        }
        .album-win-btns {
            display: flex;
            gap: 8px;
        }
        .album-win-btn {
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 4px;
            background: rgba(255,255,0.3);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            font-family: Arial, sans-serif;
        }
        .album-preview-img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }
        /* 大图弹窗 */
        .photo-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .photo-modal-overlay.active {
            display: flex;
        }
        .photo-modal-box {
            background: #fdf4ff;
            border: 3px solid #e9c5ff;
            border-radius: 20px;
            max-width: 90vw;
            max-height: 90vh;
            width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .modal-title-bar {
            background: linear-gradient(90deg, #e2a8ff, #ff99cc, #e2a8ff);
            padding: 14px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-close-btn {
            width: 32px;
            height: 32px;
            border: 2px solid #fff;
            border-radius: 6px;
            background: rgba(255,255,0.35);
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .modal-photo-display {
            padding: 20px;
            text-align: center;
        }
        .modal-main-photo {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 12px;
            border: 2px solid #ffcce0;
        }
        .photo-nav-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .photo-nav-btn,
        .admin-upload-btn {
            padding: 8px 20px;
            background: linear-gradient(90deg, #ff99cc, #cc66ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            font-family: "Font_Nav_EN", "Font_Nav_CN", sans-serif;
        }
        .admin-upload-btn {
            background: linear-gradient(90deg, #ff66aa, #cc4488);
        }
        .comment-input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            padding: 0 20px;
        }
        .comment-name,
        .comment-text {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #ff99dd;
            border-radius: 10px;
            background: #fff;
            color: #6b2e82;
            font-family: "Font_Body_CN", "Font_Body_EN";
        }
        .comment-text {
            min-height: 90px;
            resize: vertical;
        }
        .submit-comment-btn {
            align-self: flex-end;
            padding: 9px 22px;
            background: linear-gradient(90deg, #ff99cc, #cc66ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            font-family: "Font_Nav_EN", "Font_Nav_CN", sans-serif;
        }
        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 0 20px 20px;
        }
        .comment-item {
            padding: 12px 16px;
            background: #fffafd;
            border: 2px solid #ffcce0;
            border-radius: 12px;
        }
        .comment-author {
            font-weight: bold;
            color: #d03070;
            margin-bottom: 6px;
        }
        .comment-time {
            font-size: 12px;
            color: #b888a0;
            text-align: right;
            margin-top: 6px;
        }
        .empty-comment-tip {
            text-align: center;
            color: #b888a0;
            padding: 30px;
        }
        /* 底部时间栏 */
        .footer-time-bar {
            width: 100%;
            text-align: center;
            padding: 14px;
            background: rgba(255, 205, 228, 0.65);
            border-top: 3px solid transparent;
            border-image: linear-gradient(90deg, #ff77bb, #ffbbee) 1;
            color: #881f4f;
            font-size: 19px;
            letter-spacing: 1.2px;
            margin-top: 60px;
            text-shadow: 0 0 5px #ffbbee;
        }
        /* BGM按钮 */
        .bgm-toggle-button {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 60px;
            height: 60px;
            background: #fff;
            border: 4px double #ff66aa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            box-shadow: 0 0 12px rgba(255,120,180,0.4);
            transition: all 0.2s;
        }
        .bgm-toggle-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255,90,160,0.6);
        }
        .gramophone-icon {
            width: 36px;
            height: 36px;
            object-fit: contain;
            filter: drop-shadow(0 0 4px #ffbbee);
        }
        .sparkle-particle-layer {
            position: fixed;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }
        /* 移动端适配 */
        @media (max-width: 840px) {
            .content-container {
                flex-direction: column !important;
            }
            .left-sidebar-wrap {
                width: 100%;
                min-width: unset;
            }
            .top-cat-banner {
                height: 320px;
            }
            .site-title-glitter {
                font-size: 48px;
                right: 10px;
            }
            .star-deco-left,
            .star-deco-right {
                font-size: 22px;
            }
            .sticker-butterfly {
                width: 120px;
            }
            .sticker-heart {
                width: 70px;
            }
            .gallery-header-block {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            .gallery-main-title {
                font-size: 36px;
            }
            .gallery-header-img {
                max-width: 90%;
            }
            .album-grid-wrap {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="sparkle-particle-layer"></div>
    <!-- 相册无开场动画 -->
    <div class="main-wrapper" id="mainPage">
        <div class="top-cat-banner">
            <img class="float-sticker sticker-butterfly" src="./assets/images/butterfly.png" alt="floating butterfly">
            <svg class="float-sticker sticker-daisy" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="32" cy="32" r="26" fill="#fff8c8" />
                <circle cx="32" cy="14" r="14" fill="#ffdd66" />
                <circle cx="20" cy="20" r="8" fill="#fff8c8" />
                <circle cx="44" cy="20" r="8" fill="#fff8c8" />
                <circle cx="20" cy="44" r="8" fill="#fff8c8" />
                <circle cx="44" cy="44" r="8" fill="#fff8c8" />
                <circle cx="32" cy="18" r="8" fill="#fff8c8" />
                <circle cx="32" cy="46" r="8" fill="#fff8c8" />
                <circle cx="18" cy="32" r="8" fill="#fff8c8" />
                <circle cx="46" cy="32" r="8" fill="#fff8c8" />
            </svg>
            <img class="float-sticker sticker-heart" src="./assets/images/heart.png" alt="pink heart">
            <div class="site-title-glitter">
                <span class="star-deco-left">✦</span>
                Lena's Mirror
                <span class="star-deco-right">✦</span>
            </div>
        </div>
        <div class="content-container">
            <div class="left-sidebar-wrap">
                <aside class="sidebar-nav y2k-neon-panel">
                    <a href="index.html" class="nav-link">
                        <img class="nav-icon" src="./assets/images/icon_home.gif" alt="home icon">
                        Home 首页
                    </a>
                    <a href="journal.html" class="nav-link">
                        <img class="nav-icon" src="./assets/images/icon_journal.gif" alt="journal icon">
                        Journal 随笔
                    </a>
                    <a href="gallery.html" class="nav-link">
                        <img class="nav-icon" src="./assets/images/icon_gallery.gif" alt="gallery icon">
                        Gallery 相册
                    </a>
                    <a href="guestbook.html" class="nav-link">
                        <img class="nav-icon" src="./assets/images/icon_message.gif" alt="guestbook icon">
                        Guestbook 留言板
                    </a>
                </aside>
            </div>
            <div class="main-content-area">
                <div class="gallery-header-block">
                    <img class="gallery-header-img" src="./assets/images/gallery_top_main.jpg" alt="memory header pic">
                    <h1 class="gallery-main-title">My Sweet Memories</h1>
                </div>
                <div class="divider-row">
                    <img class="divider-gif divider-side" src="./assets/images/divider_1.gif" alt="divider left">
                    <img class="divider-gif divider-center" src="./assets/images/divider_2.gif" alt="divider middle">
                    <img class="divider-gif divider-side" src="./assets/images/divider_1.gif" alt="divider right">
                </div>
                <div class="album-grid-wrap" id="albumContainer">
                    <div class="album-window" data-album-id="album_daily" data-github-folder="assets/images/album_daily/">
                        <div class="album-win-titlebar">
                            <span class="album-win-name">Daily Life</span>
                            <div class="album-win-btns">
                                <span class="album-win-btn">-</span>
                                <span class="album-win-btn">□</span>
                                <span class="album-win-btn">×</span>
                            </div>
                        </div>
                        <img class="album-preview-img" src="./assets/images/album_daily/cover.jpg" alt="album preview">
                    </div>
                    <div class="album-window" data-album-id="album_portrait" data-github-folder="assets/images/album_portrait/">
                        <div class="album-win-titlebar">
                            <span class="album-win-name">Portrait</span>
                            <div class="album-win-btns">
                                <span class="album-win-btn">-</span>
                                <span class="album-win-btn">□</span>
                                <span class="album-win-btn">×</span>
                            </div>
                        </div>
                        <img class="album-preview-img" src="./assets/images/album_portrait/cover.jpg" alt="album preview">
                    </div>
                    <div class="album-window" data-album-id="album_liumi" data-github-folder="assets/images/album_liumi/">
                        <div class="album-win-titlebar">
                            <span class="album-win-name">Liu Mi</span>
                            <div class="album-win-btns">
                                <span class="album-win-btn">-</span>
                                <span class="album-win-btn">□</span>
                                <span class="album-win-btn">×</span>
                            </div>
                        </div>
                        <img class="album-preview-img" src="./assets/images/album_liumi/cover.jpg" alt="album preview">
                    </div>
                </div>
            </div>
        </div>
        <div class="footer-time-bar" id="timeDisplay"></div>
    </div>
    <!-- 大图弹窗 -->
    <div class="photo-modal-overlay" id="photoModal">
        <div class="photo-modal-box">
            <div class="modal-title-bar">
                <h3 class="modal-album-title" id="modalAlbumName">相册名称</h3>
                <button class="modal-close-btn" id="closeModalBtn">×</button>
            </div>
            <div class="modal-photo-display">
                <img class="modal-main-photo" id="modalImage" src="" alt="full photo">
                <div class="photo-nav-row">
                    <button class="photo-nav-btn" id="prevPhotoBtn">上一张</button>
                    <button class="photo-nav-btn" id="nextPhotoBtn">下一张</button>
                    <button class="admin-upload-btn" id="adminUploadBtn">管理员上传图片</button>
                </div>
            </div>
            <div class="photo-comment-section">
                <div class="comment-input-area">
                    <input class="comment-name" id="inputCommentName" placeholder="你的昵称">
                    <textarea class="comment-text" id="inputCommentText" placeholder="写下对这张照片的评论..."></textarea>
                    <button class="submit-comment-btn" id="sendCommentBtn">发送评论</button>
                </div>
                <div class="comment-list" id="photoCommentList">
                    <div class="empty-comment-tip">暂无评论，快来留下第一条吧</div>
                </div>
            </div>
        </div>
    </div>
    <!-- BGM按钮 -->
    <button class="bgm-toggle-button" id="bgmBtn">
        <img class="gramophone-icon" src="./assets/images/gramophone.png" alt="music toggle">
    </button>
    <audio id="bgmAudio" loop volume="0.3" muted preload="auto">
        <source src="./assets/audio/y2k-vintage-sweet-bgm.mp3" type="audio/mpeg">
    <script>
        const mainPage = document.getElementById("mainPage");
        const bgmAudio = document.getElementById("bgmAudio");
        const photoModal = document.getElementById("photoModal");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const modalImage = document.getElementById("modalImage");
        const modalAlbumName = document.getElementById("modalAlbumName");
        const prevPhotoBtn = document.getElementById("prevPhotoBtn");
        const nextPhotoBtn = document.getElementById("nextPhotoBtn");
        const adminUploadBtn = document.getElementById("adminUploadBtn");
        const photoCommentList = document.getElementById("photoCommentList");
        const inputCommentName = document.getElementById("inputCommentName");
        const inputCommentText = document.getElementById("inputCommentText");
        const sendCommentBtn = document.getElementById("sendCommentBtn");

        const GITHUB_USER = "你的GitHub用户名";
        const GITHUB_REPO = "你的仓库名称";
        const GITHUB_BRANCH = "main";

        const albumData = {
            album_daily: {
                name: "Daily Life",
                folder: "./assets/images/album_daily/",
                images: [
                    "./assets/images/album_daily/pic1.jpg",
                    "./assets/images/album_daily/pic2.jpg",
                    "./assets/images/album_daily/pic3.jpg",
                    "./assets/images/album_daily/pic4.jpg"
                ]
            },
            album_portrait: {
                name: "Portrait",
                folder: "./assets/images/album_portrait/",
                images: [
                    "./assets/images/album_portrait/pic1.jpg",
                    "./assets/images/album_portrait/pic2.jpg",
                    "./assets/images/album_portrait/pic3.jpg"
                ]
            },
            album_liumi: {
                name: "Liu Mi",
                folder: "./assets/images/album_liumi/",
                images: [
                    "./assets/images/album_liumi/pic1.jpg",
                    "./assets/images/album_liumi/pic2.jpg"
                ]
            }
        };
        let currentAlbumId = "";
        let currentFolderPath = "";
        let currentPhotoIndex = 0;

        function pageInit() {
            document.body.addEventListener("click", unlockAudio);
        }
        function unlockAudio() {
            bgmAudio.muted = false;
            bgmAudio.play();
            document.body.removeEventListener("click", unlockAudio);
        }
        function refreshTime() {
            const now = new Date();
            const weekCN = ["周日","周一","周二","周三","周四","周五","周六"];
            const weekEN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
            const monthEN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
            const y = now.getFullYear();
            const mNum = now.getMonth() + 1;
            const d = now.getDate();
            const wIndex = now.getDay();
            const wCn = weekCN[wIndex];
            const wEn = weekEN[wIndex];
            const monthEng = monthEN[now.getMonth()];
            const showText = `${y}年${mNum}月${d} ${wCn} ${wEn} ${monthEng} ${d} ${y}`;
            document.getElementById("timeDisplay").innerText = showText;
        }
        refreshTime();
        setInterval(refreshTime, 1000);

        const sparkleWrap = document.querySelector(".sparkle-particle-layer");
        function createSparkle() {
            const size = Math.random() * 14 + 4;
            const sparkle = document.createElement("div");
            sparkle.style.cssText = `
                position:absolute;
                width:${size}px;
                height:${size}px;
                left:${Math.random() * 100}vw;
                top:-10px;
                background:radial-gradient(#ffffff, #ffd0f0, #e0b8ff);
                border-radius:50%;
                opacity:${Math.random() * 0.65 + 0.2};
                box-shadow:0 0 8px #ffb8e8, 0 0 18px #e8b8ff, 0 0 30px #d8a8ee;
                animation:fall ${Math.random() * 10 + 5}s linear forwards, twinkle 1s infinite alternate;
            `;
            sparkleWrap.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 15000);
        }
        setInterval(createSparkle, 180);
        const keyframeStyle = document.createElement("style");
        keyframeStyle.textContent = `
            @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
            @keyframes twinkle { from { opacity:0.2; } to { opacity:0.95; } }
        `;
        document.head.appendChild(keyframeStyle);

        const audioBtn = document.getElementById("bgmBtn");
        let musicPlaying = true;
        audioBtn.addEventListener("click", () => {
            if (musicPlaying) {
                bgmAudio.pause();
                musicPlaying = false;
                audioBtn.style.background = "#ffd6ec";
            } else {
                bgmAudio.play();
                musicPlaying = true;
                audioBtn.style.background = "#ffffff";
            }
        });

        const albumWindows = document.querySelectorAll(".album-window");
        albumWindows.forEach(windowEl => {
            windowEl.addEventListener("click", () => {
                currentAlbumId = windowEl.dataset.albumId;
                currentFolderPath = windowEl.dataset.githubFolder;
                currentPhotoIndex = 0;
                renderModalPhoto();
                renderPhotoComments();
                photoModal.classList.add("active");
            });
        });
        function renderModalPhoto() {
            const album = albumData[currentAlbumId];
            modalAlbumName.innerText = album.name;
            modalImage.src = album.images[currentPhotoIndex];
        }
        prevPhotoBtn.addEventListener("click", () => {
            const album = albumData[currentAlbumId];
            currentPhotoIndex = (currentPhotoIndex - 1 + album.images.length) % album.images.length;
            renderModalPhoto();
            renderPhotoComments();
        });
        nextPhotoBtn.addEventListener("click", () => {
            const album = albumData[currentAlbumId];
            currentPhotoIndex = (currentPhotoIndex + 1) % album.images.length;
            renderModalPhoto();
            renderPhotoComments();
        });
        closeModalBtn.addEventListener("click", () => {
            photoModal.classList.remove("active");
        });
        photoModal.addEventListener("click", (e) => {
            if (e.target === photoModal) photoModal.classList.remove("active");
        });
        adminUploadBtn.addEventListener("click", () => {
            const uploadUrl = `https://github.com/${GITHUB_USER}/${GITHUB_REPO}/upload/${GITHUB_BRANCH}/${currentFolderPath}`;
            window.open(uploadUrl, "_blank");
            alert("仅仓库管理员可上传图片，上传后刷新页面");
        });
        function getCommentStorageKey() {
            return `photo_comment_${currentAlbumId}_${currentPhotoIndex}`;
        }
        function loadPhotoComments() {
            const saved = localStorage.getItem(getCommentStorageKey());
            if (!saved) return [];
            try { return JSON.parse(saved); } catch { return []; }
        }
        function savePhotoComments(list) {
            localStorage.setItem(getCommentStorageKey(), JSON.stringify(list));
        }
        function renderPhotoComments() {
            const list = loadPhotoComments();
            photoCommentList.innerHTML = "";
            if (list.length === 0) {
                photoCommentList.innerHTML = `<div class="empty-comment-tip">暂无评论，快来留下第一条吧</div>`;
                return;
            }
            list.forEach(item => {
                const div = document.createElement("div");
                div.className = "comment-item";
                div.innerHTML = `
                    <div class="comment-author">${item.name}</div>
                    <div class="comment-content">${item.content}</div>
                    <div class="comment-time">${item.time}</div>
                `;
                photoCommentList.appendChild(div);
            });
        }
        sendCommentBtn.addEventListener("click", () => {
            const name = inputCommentName.value.trim();
            const content = inputCommentText.value.trim();
            if (!name || !content) { alert("请填写昵称和评论"); return; }
            const now = new Date();
            const time = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
            const list = loadPhotoComments();
            list.unshift({ name, content, time });
            savePhotoComments(list);
            renderPhotoComments();
            inputCommentName.value = "";
            inputCommentText.value = "";
        });
        pageInit();
    </script>
</body>
</html>
