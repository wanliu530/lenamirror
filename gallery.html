<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Netlify CMS 脚本 -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <title>✧⋆ Memories Gallery ˚‧₊˚✧⋆</title>
    <style>
        /* ====================== 独立字体 仅woff2 原版原样 ====================== */
        @font-face {
            font-family: "Font_Loading";
            src: url("assets/fonts/font_loading.woff2") format("woff2");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_SiteTitle";
            src: url("assets/fonts/font_title.woff2") format("woff2");
            font-weight: normal;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Nav_EN";
            src: url("./assets/fonts/font_body_en.woff2") format("woff2");
            unicode-range: U+0000-007F, U+00A0-00FF, U+2000-206F;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Nav_CN";
            src: url("./assets/fonts/font_body_cn.woff2");
            unicode-range: U+4E00-9FFF, U+3000-303F, U+FF00-FFEF;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Body_EN";
            src: url("./assets/fonts/font_body_en.woff2") format("woff2");
            unicode-range: U+0000-007F, U+00A0-00FF, U+2000-206F;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Body_CN";
            src: url("./assets/fonts/font_body_cn.woff2") format("woff2");
            unicode-range: U+4E00-9FFF, U+3000-303F, U+FF00-FFEF;
            font-display: swap;
        }
        /* ====================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url("./assets/images/cursor_pixel.gif"), auto;
        }
        body {
            font-family: "Font_Body_EN", "Font_Body_CN", sans-serif;
            overflow-x: hidden;
            background: #fff5fb;
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03' fill='%23ff99cc'/%3E%3C/svg%3E");
        }
        a:hover, button:hover, .album-window:hover {
            cursor: url("./assets/images/cursor_pixel.gif"), pointer;
        }
        .nav-link {
            font-family: "Font_Nav_EN", "Font_Nav_CN", sans-serif;
        }
        .y2k-neon-panel {
            border: 3px solid #ff77bb;
            box-shadow:
                0 0 10px #ff77bb40,
                0 0 20px #ffbbee30,
                inset 0 0 12px #ffcce020;
            backdrop-filter: blur(3px);
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: transparent;
        }
        .y2k-neon-panel::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #ffc0e850, transparent);
            animation: soft-scan 3.5s linear infinite;
        }
        @keyframes soft-scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        /* 顶部横幅 原版完全还原 */
        .top-cat-banner {
            width: 100%;
            height: 440px;
            background: url("./assets/images/cat-banner.jpg") center/cover no-repeat;
            position: relative;
            padding: 30px;
            overflow: hidden;
            border-bottom: 4px solid transparent;
            border-image: linear-gradient(90deg, #ff77bb, #ffbbee) 1;
        }
        .float-sticker {
            position: absolute;
            pointer-events: none;
            animation: slow-float 6s ease-in-out infinite;
            filter: drop-shadow(0 0 6px #ffbbee);
        }
        .sticker-butterfly { top: 20px; left: 10%; width: 180px; animation-delay:0.5s; }
        .sticker-daisy { top: 60px; left: 75%; width: 70px; animation-delay:1.2s; }
        .sticker-heart { bottom:80px; left:20%; width:100px; animation-delay:2s; }
        @keyframes slow-float {
            0% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-16px) rotate(3deg); }
            100% { transform: translateY(0) rotate(-3deg); }
        }
        .site-title-glitter {
            position: absolute;
            right: 40px;
            bottom: 30px;
            font-size: 74px;
            font-family: "Font_SiteTitle";
            font-weight: 950;
            letter-spacing: 5px;
            font-style: italic;
            color: #b81e60;
            animation: title-shine 1.4s infinite alternate;
            text-shadow:
                3px 3px 0 #ffffff,
                -1px -1px 0 #fff,
                1px -1px 0 #fff,
                -1px 1px 0 #fff,
                0 0 14px #ff4488,
                0 0 28px #c82266,
                0 0 42px #a01850;
            transform: rotate(-2deg);
        }
        .star-deco-left {
            position: absolute;
            right: calc(100% + 12px);
            top: 10px;
            font-size: 32px;
            color: #fff;
            text-shadow: 0 0 10px #ffdd66;
            animation: star-blink 0.8s infinite alternate;
        }
        .star-deco-right {
            position: absolute;
            left: calc(100% + 12px);
            bottom: 8px;
            font-size: 32px;
            color: #fff;
            text-shadow: 0 0 10px #ffdd66;
            animation: star-blink 0.8s infinite alternate 0.4s;
        }
        @keyframes star-blink {
            from { opacity:0.5; transform:scale(0.9); }
            to { opacity:1; transform:scale(1.2); }
        }
        @keyframes title-shine {
            from { filter: drop-shadow(0 0 6px #ff99cc); }
            to { filter: drop-shadow(0 0 22px #b81e60); }
        }
        /* 主体布局 原版不变 */
        .content-container {
            display: flex !important;
            flex-direction: row !important;
            align-items: flex-start;
            width: 92%;
            max-width: 1420px;
            margin: 45px auto;
            gap: 40px;
        }
        .left-sidebar-wrap {
            flex-shrink: 0 !important;
            width: 230px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .sidebar-nav {
            width: 100%;
            padding: 32px 22px;
            z-index: 10;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 30px 0;
            text-decoration: none;
            font-size: 22px;
            color: #801048 !important;
            font-weight: bold;
            transition: all 0.2s;
            padding: 8px 10px;

            transform: translateX(6px);

        }

            width: 18px;
            height: 18px;
            object-fit: contain;
        }
        .main-content-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 100%;
        }
        /* ========== 相册顶部标题 还原原图+标题布局 ========== */
        .gallery-header-block {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 36px;
            flex-wrap: wrap;
            padding: 20px 0;
        }
        .gallery-header-img {
            max-width: 320px;
            max-height: 260px;
            object-fit: contain;
            display: block;
        }
        .gallery-main-title {
            font-family: "Font_SiteTitle";
            font-size: 52px;
            color: #b81e60;
            letter-spacing: 4px;
            animation: title-shine 2s infinite alternate;
        }
        /* 分割线 原版GIF分割线恢复 */
        .divider-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            width: 100%;
        }
        .divider-gif {
            object-fit: contain;
        }
        .divider-side {
            width: 37%;
            height: 60px;
        }
        .divider-center {
            width: 40%;
            height: 68px;
        }
        /* 相册网格 原版Windows窗口样式 完全保留 */
        .album-grid-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 32px;
            width: 100%;
        }
        .album-window {
            background: #fdf4ff;
            border: 3px solid #e9c5ff;
            border-radius: 18px;
            box-shadow:

                0 0 35px #dd88ff35;

        .album-window:hover {

        }
        .album-win-titlebar {

            font-weight: bold;

            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;

        .modal-photo-display {
            padding: 20px;

        }
        .modal-main-photo {
            max-width: 100%;
            max-height: 60vh;

        }
        .photo-desc {
            margin-top:12px;

        }
        .photo-nav-row {
            display: flex;

        .photo-nav-btn,

            padding: 8px 20px;

            border-image: linear-gradient(90deg, #ff77bb, #ffbbee) 1;

        /* BGM悬浮按钮 原版样式 */
        .bgm-toggle-button {

            bottom: 28px;
            right: 28px;
            width: 60px;
            height: 60px;
            background: #fff;

            border-radius: 50%;

        }
        .bgm-toggle-button:hover {

        }
        .gramophone-icon {
            width: 36px;
            height: 36px;
            object-fit: contain;
            filter: drop-shadow(0 0 4px #ffbbee);
        }
        .sparkle-particle-layer {
            position: fixed;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes fall{to{transform:translateY(100vh) rotate(360deg)}}
        @keyframes twinkle{from{opacity:0.2}to{opacity:0.95}}
        /* 移动端适配 原版不变 */
        @media (max-width: 840px) {
            .content-container { flex-direction: column !important; }
            .left-sidebar-wrap { width: 100%; }
            .top-cat-banner { height: 320px; }

            .star-deco-left,.star-deco-right { font-size:22px; }

            .album-grid-wrap { grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); }
        }
    </style>
</head>

    <script>
        // 和journal完全一致GitHub仓库配置
        const GITH_USER = "wanliu530";
        const GITH_REPO = "lenamirror";
        const GITH_BRANCH = "main";
        const GALLERY_MD_PATH = "content/gallery/";

        // DOM缓存 全部还原原版ID
        const albumContainer = document.getElementById("albumContainer");
        const photoModal = document.getElementById("photoModal");
        const closeModal = document.getElementById("closeModal");
        const modalAlbumName = document.getElementById("modalAlbumName");
        const modalImage = document.getElementById("modalImage");
        const photoDesc = document.getElementById("photoDesc");
        const prevPhotoBtn = document.getElementById("prevPhotoBtn");
        const nextPhotoBtn = document.getElementById("nextPhotoBtn");
        const adminUploadBtn = document.getElementById("adminUploadBtn");
        const bgmAudio = document.getElementById("bgmAudio");
        const bgmBtn = document.getElementById("bgmBtn");

        // 全局相册数据
        let allGalleryItems = [];
        const albumGroups = ["Daily Life","Portrait","Liu Mi"];
        let currentGroupImages = [];
        let currentIndex = 0;

        // 跳转CMS后台按钮
        adminUploadBtn.addEventListener("click", ()=>{
            window.open(`${window.location.origin}/admin`, "_blank");
        });

        // 解析gallery的md（复刻journal解析逻辑）
        function parseGalleryMarkdown(rawMd){
            let title = "无标题照片";
            let albumCat = "";
            let imgUrl = "";
            let dateStr = "";
            const fmReg = /^---[\s\S]*?---/;
            const fmMatch = rawMd.match(fmReg);
            if(fmMatch){
                const fmText = fmMatch[0];
                const tMatch = fmText.match(/title:\s*(.+?)\n/);
                const aMatch = fmText.match(/album_category:\s*(.+?)\n/);
                const iMatch = fmText.match(/image:\s*(.+?)\n/);
                const dMatch = fmText.match(/date:\s*(.+?)\n/);
                if(tMatch) title = tMatch[1].trim();
                if(aMatch) albumCat = aMatch[1].trim();
                if(iMatch) imgUrl = iMatch[1].trim();
                if(dMatch) dateStr = dMatch[1].trim();
            }
            // 拼接GitHub raw完整图片地址 防止404
            if(imgUrl && !imgUrl.startsWith("http")){
                imgUrl = `https://raw.githubusercontent.com/${GITH_USER}/${GITH_REPO}/${GITH_BRANCH}${imgUrl}`;
            }
            return {title, album:albumCat, img:imgUrl, date:dateStr};
        }

        // 读取content/gallery下所有md文件（和journal读取API一模一样）
        async function loadAllGalleryMd(){
            try{
                const api = `https://api.github.com/repos/${GITH_USER}/${GITH_REPO}/contents/${GALLERY_MD_PATH}?ref=${GITH_BRANCH}`;
                const res = await fetch(api);
                if(!res.ok) throw Error("无相册文件");
                const fileList = await res.json();
                const tempArr = [];
                for(const f of fileList){
                    if(!f.name.endsWith(".md")) continue;
                    const mdRes = await fetch(f.download_url);
                    const mdText = await mdRes.text();
                    const data = parseGalleryMarkdown(mdText);
                    if(data.img && data.album) tempArr.push(data);
                }
                // 按日期从新到旧排序，数组第一位=最新上传照片
                allGalleryItems = tempArr.sort((a,b)=>new Date(b.date) - new Date(a.date));
                renderAllAlbumWindows();
            }catch(err){
                console.error("相册加载失败：",err);
                albumContainer.innerHTML = `<div style="grid-column:1/-1;text-align:center;font-size:22px;color:#c04080;padding:60px 0;">相册暂无图片，点击弹窗上方按钮前往后台上传</div>`;
            }
        }

        // 渲染原版Windows样式相册窗口（完全还原你原来的HTML结构）
        function renderAllAlbumWindows(){
            albumContainer.innerHTML = "";
            albumGroups.forEach(groupName=>{
                // 筛选当前相册所有图片
                const groupImgs = allGalleryItems.filter(item=>item.album === groupName);
                if(groupImgs.length === 0) return;
                const newestCoverImg = groupImgs[0];
                // 原版窗口HTML结构一丝不动
                const windowDom = document.createElement("div");
                windowDom.className = "album-window";
                windowDom.dataset.group = groupName;
                windowDom.innerHTML = `
                    <div class="album-win-titlebar">
                        <span class="album-win-name">${groupName}</span>
                        <div class="album-win-btns">
                            <span class="album-win-btn">-</span>
                            <span class="album-win-btn">□</span>
                            <span class="album-win-btn">×</span>
                        </div>
                    </div>
                    <img class="album-preview-img" src="${newestCoverImg.img}" loading="lazy">
                `;
                windowDom.onclick = ()=>openAlbum(groupName);
                albumContainer.appendChild(windowDom);
            })
        }

        // 打开对应相册弹窗
        function openAlbum(groupName){
            currentGroupImages = allGalleryItems.filter(item=>item.album === groupName);
            currentIndex = 0;
            modalAlbumName.innerText = groupName;
            renderCurrentPhoto();
            photoModal.classList.add("active");
        }

        // 渲染当前大图+描述
        function renderCurrentPhoto(){
            const pic = currentGroupImages[currentIndex];
            modalImage.src = pic.img;
            photoDesc.innerText = pic.title;
        }

        // 切换上一张
        prevPhotoBtn.addEventListener("click",()=>{
            currentIndex = (currentIndex - 1 + currentGroupImages.length) % currentGroupImages.length;
            renderCurrentPhoto();
        })
        // 切换下一张
        nextPhotoBtn.addEventListener("click",()=>{
            currentIndex = (currentIndex + 1) % currentGroupImages.length;
            renderCurrentPhoto();
        })
        // 关闭弹窗
        closeModal.addEventListener("click",()=>{
            photoModal.classList.remove("active");
        })
        photoModal.addEventListener("click",(e)=>{
            if(e.target === photoModal) photoModal.classList.remove("active");
        })

        // 底部实时时间 原版格式不变
        function refreshTime() {
            const now = new Date();
            const weekCN = ["周日","周一","周二","周三","周四","周五","周六"];
            const weekEN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
            const monthEN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
            const y = now.getFullYear();
            const mNum = now.getMonth() + 1;
            const d = now.getDate();
            const wIdx = now.getDay();
            const show = `${y}年${mNum}月${d} ${weekCN[wIdx]} ${weekEN[wIdx]} ${monthEN[now.getMonth()]} ${d} ${y}`;
            document.getElementById("timeDisplay").innerText = show;
        }
        refreshTime();
        setInterval(refreshTime, 1000);

        // 飘落星光粒子 原版不变
        const sparkleWrap = document.querySelector(".sparkle-particle-layer");
        function createSparkle() {
            const size = Math.random() * 14 + 4;
            const sparkle = document.createElement("div");
            sparkle.style.cssText = `
                position:absolute;
                width:${size}px;
                height:${size}px;
                left:${Math.random() * 100}vw;
                top:-10px;
                background:radial-gradient(#ffffff, #ffd0f0, #e0b8ff);
                border-radius:50%;
                opacity:${Math.random() * 0.65 + 0.2};
                box-shadow:0 0 8px #ffb8e8, 0 0 18px #e8b8ff, 0 0 30px #d8a8ee;
                animation:fall ${Math.random() * 10 + 5}s linear forwards, twinkle 1s infinite alternate;
            `;
            sparkleWrap.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 15000);
        }
        setInterval(createSparkle, 180);
        const keyframeStyle = document.createElement("style");
        keyframeStyle.textContent = `
            @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
            @keyframes twinkle { from { opacity:0.2; } to { opacity:0.95; } }
        `;
        document.head.appendChild(keyframeStyle);

        // BGM控制 原版逻辑
        let musicPlaying = true;
        bgmBtn.addEventListener("click", () => {
            if (musicPlaying) {
                bgmAudio.pause();
                musicPlaying = false;
                bgmBtn.style.background = "#ffd6ec";
            } else {
                bgmAudio.play();
                musicPlaying = true;
                bgmBtn.style.background = "#ffffff";
            }
        });
        document.body.addEventListener("click", () => {
            bgmAudio.muted = false;
            bgmAudio.play();
        }, { once: true });

        // 页面初始化加载相册（DOM加载完成执行）
        window.addEventListener("DOMContentLoaded", loadAllGalleryMd);
    </script>
</body>
</html>
