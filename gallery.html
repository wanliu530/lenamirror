<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Netlify CMS 认证脚本 -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <title>✧⋆ Lena's Mirror Gallery ˚‧₊˚✧⋆</title>
    <style>
        /* 字体完全沿用原版 */
        @font-face {
            font-family: "Font_SiteTitle";
            src: url("assets/fonts/font_title.woff2") format("woff2");
            font-weight: normal;
            font-style: italic;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Nav_EN";
            src: url("assets/fonts/font_body_en.woff2") format("woff2");
            unicode-range: U+0000-007F, U+00A0-00FF, U+2000-206F;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Nav_CN";
            src: url("assets/fonts/font_body_cn.woff2");
            unicode-range: U+4E00-9FFF, U+3000-303F, U+FF00-FFEF;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Body_EN";
            src: url("assets/fonts/font_body_en.woff2") format("woff2");
            unicode-range: U+0000-007F, U+00A0-00FF, U+2000-206F;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Body_CN";
            src: url("assets/fonts/font_body_cn.woff2");
            unicode-range: U+4E00-9FFF, U+3000-303F, U+FF00-FFEF;
            font-display: swap;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url("assets/images/cursor_pixel.gif"), auto;
        }
        body {
            font-family: "Font_Body_EN", "Font_Body_CN", sans-serif;
            overflow-x: hidden;
            background: #fff5fb;
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03' fill='%23ff99cc'/%3E%3C/svg%3E");
        }
        a:hover, button:hover, .album-window:hover {
            cursor: url("assets/images/cursor_pixel.gif"), pointer;
        }
        .album-window {
            cursor: pointer !important;
        }
        .nav-link {
            font-family: "Font_Nav_EN", "Font_Nav_CN", sans-serif;
        }
        .y2k-neon-panel {
            border: 3px solid #ff77bb;
            box-shadow: 0 0 10px #ff77bb40, 0 0 20px #ffbbee30, inset 0 0 12px #ffcce020;
            backdrop-filter: blur(3px);
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: transparent;
        }
        .y2k-neon-panel::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #ffc0e850, transparent);
            animation: soft-scan 3.5s linear infinite;
        }
        @keyframes soft-scan { 0% { left: -100%; } 100% { left: 100%; } }
        /* 顶部横幅原版 */
        .top-cat-banner {
            width: 100%;
            height: 440px;
            background: url("assets/images/cat-banner.jpg") center/cover no-repeat;
            position: relative;
            padding: 30px;
            overflow: hidden;
            border-bottom: 4px solid transparent;
            border-image: linear-gradient(90deg, #ff77bb, #ffbbee) 1;
        }
        .float-sticker {
            position: absolute;
            pointer-events: none;
            animation: slow-float 6s ease-in-out infinite;
            filter: drop-shadow(0 0 6px #ffbbee);
        }
        .sticker-butterfly { top: 20px; left: 10%; width: 180px; animation-delay: 0.5s; }
        .sticker-daisy { top: 60px; left: 75%; width: 70px; animation-delay: 1.2s; }
        .sticker-heart { bottom: 80px; left: 20%; width: 100px; animation-delay: 2s; }
        @keyframes slow-float {
            0% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-16px) rotate(3deg); }
            100% { transform: translateY(0) rotate(-3deg); }
        }
        .site-title-glitter {
            position: absolute;
            right: 40px;
            bottom: 30px;
            font-size: 74px;
            font-family: "Font_SiteTitle";
            font-weight: 950;
            letter-spacing: 5px;
            font-style: italic;
            color: #b81e60;
            animation: title-shine 1.4s infinite alternate;
            text-shadow: 3px 3px 0 #ffffff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 0 0 14px #ff4488, 0 0 28px #c82266, 0 0 42px #a01850;
            transform: rotate(-2deg);
        }
        .star-deco-left {
            position: absolute;
            right: calc(100% + 12px);
            top: 10px;
            font-size: 32px;
            color: #fff;
            text-shadow: 0 0 10px #ffdd66;
            animation: star-blink 0.8s infinite alternate;
        }
        .star-deco-right {
            position: absolute;
            left: calc(100% + 12px);
            bottom: 8px;
            font-size: 32px;
            color: #fff;
            text-shadow: 0 0 10px #ffdd66;
            animation: star-blink 0.8s infinite alternate 0.4s;
        }
        @keyframes star-blink { from { opacity: 0.5; transform: scale(0.9); } to { opacity: 1; transform: scale(1.2); } }
        @keyframes title-shine { from { filter: drop-shadow(0 0 6px #ff99cc); } to { filter: drop-shadow(0 0 22px #b81e60); } }
        /* 主体布局 */
        .content-container {
            display: flex !important;
            flex-direction: row !important;
            align-items: flex-start;
            width: 92%;
            max-width: 1420px;
            margin: 45px auto;
            gap: 40px;
        }
        .left-sidebar-wrap {
            flex-shrink: 0 !important;
            width: 230px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .sidebar-nav {
            width: 100%;
            padding: 32px 22px;
            z-index: 10;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 30px 0;
            text-decoration: none;
            font-size: 22px;
            color: #801048 !important;
            font-weight: bold;
            transition: all 0.2s;
            padding: 8px 10px;
            border-radius: 6px;
        }
        .nav-link:hover { transform: translateX(6px); color: #ff2277 !important; }
        .nav-icon { width: 18px; height: 18px; object-fit: contain; }
        .main-content-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 100%;
        }
        /* 相册头部 gallery_top_main.jpg */
        .gallery-header-block {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 36px;
            flex-wrap: wrap;
            padding: 20px 0;
        }
        .gallery-header-img {
            max-width: 320px;
            max-height: 260px;
            object-fit: contain;
            display: block;
            content: url("assets/images/gallery_top_main.jpg");
        }
        .gallery-main-title {
            font-family: "Font_SiteTitle";
            font-size: 52px;
            color: #b81e60;
            letter-spacing: 4px;
            animation: title-shine 2s infinite alternate;
        }
        /* 分割线 */
        .divider-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            width: 100%;
        }
        .divider-gif { object-fit: contain; }
        .divider-side { width: 37%; height: 60px; }
        .divider-center { width: 40%; height: 68px; }
        /* 相册窗口 */
        .album-grid-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 32px;
            width: 100%;
        }
        .album-window {
            background: #fdf4ff;
            border: 3px solid #e9c5ff;
            border-radius: 18px;
            box-shadow: 0 0 18px #ff99ff50, 0 0 35px #dd88ff35;
            overflow: hidden;
            position: relative;
            transition: transform 0.2s ease;
        }
        .album-window:hover { transform: translateY(-6px); box-shadow: 0 0 24px #ff88ff70; }
        .album-win-titlebar {
            background: linear-gradient(90deg, #e2a8ff, #ff99cc, #e2a8ff);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .album-win-name {
            font-family: "Font_SiteTitle";
            color: white;
            font-size: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 6px #ff77bb;
        }
        .album-win-btns { display: flex; gap: 8px; }
        .album-win-btn {
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 4px;
            background: rgba(255,255,0.3);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            font-family: Arial, sans-serif;
        }
        .album-preview-img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }
        /* 弹窗 */
        .photo-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .photo-modal-overlay.active { display: flex; }
        .photo-modal-box {
            background: #fdf4ff;
            border: 3px solid #e9c5ff;
            border-radius: 20px;
            max-width: 90vw;
            max-height: 90vh;
            width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .modal-title-bar {
            background: linear-gradient(90deg, #e2a8ff, #ff99cc, #e2a8ff);
            padding: 14px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-album-name { font-family:"Font_SiteTitle"; font-size:22px; }
        .modal-close-btn {
            width: 32px;
            height: 32px;
            border: 2px solid #fff;
            border-radius: 6px;
            background: rgba(255,255,0.35);
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .modal-photo-display { padding: 20px; text-align: center; }
        .modal-main-photo {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 12px;
            border: 2px solid #ffcce0;
        }
        .photo-desc { margin-top:12px; font-size:18px; color:#701e4e; }
        .photo-nav-row { display: flex; justify-content: center; gap: 20px; margin: 16px 0; flex-wrap: wrap; }
        .photo-nav-btn, .admin-upload-btn {
            padding: 8px 20px;
            background: linear-gradient(90deg, #ff99cc, #cc66ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            font-family: "Font_Nav_EN", "Font_Nav_CN", sans-serif;
        }
        .admin-upload-btn { background: linear-gradient(90deg, #ff66aa, #cc4488); }
        /* 评论 */
        .comment-input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            padding: 0 20px;
        }
        .comment-name, .comment-text {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #ff99dd;
            border-radius: 10px;
            background: #fff;
            color: #6b2e82;
            font-family: "Font_Body_CN", "Font_Body_EN";
        }
        .comment-text { min-height: 90px; resize: vertical; }
        .submit-comment-btn {
            align-self: flex-end;
            padding: 9px 22px;
            background: linear-gradient(90deg, #ff99cc, #cc66ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            font-family: "Font_Nav_EN", "Font_Nav_CN", sans-serif;
        }
        .comment-list { display: flex; flex-direction: column; gap: 14px; padding: 0 20px 20px; }
        .comment-item {
            padding: 12px 16px;
            background: #fffafd;
            border: 2px solid #ffcce0;
            border-radius: 12px;
        }
        .comment-author { font-weight: bold; color: #d03070; margin-bottom: 6px; }
        .comment-time { font-size: 12px; color: #b888a0; text-align: right; margin-top: 6px; }
        .empty-comment-tip { text-align: center; color: #b888a0; padding: 30px; }
        /* 底部时间 */
        .footer-time-bar {
            width: 100%;
            text-align: center;
            padding: 14px;
            background: rgba(255, 205, 228, 0.65);
            border-top: 3px solid transparent;
            border-image: linear-gradient(90deg, #ff77bb, #ffbbee) 1;
            color: #881f4f;
            font-size: 19px;
            letter-spacing: 1.2px;
            margin-top: 60px;
            text-shadow: 0 0 5px #ffbbee;
        }
        /* BGM按钮 */
        .bgm-toggle-button {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 60px;
            height: 60px;
            background: #fff;
            border: 4px double #ff66aa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            box-shadow: 0 0 12px rgba(255,120,180,0.4);
            transition: all 0.2s;
        }
        .bgm-toggle-button:hover { transform: scale(1.1); box-shadow: 0 0 20px rgba(255,90,160,0.6); }
        .gramophone-icon { width: 36px; height: 36px; object-fit: contain; filter: drop-shadow(0 0 4px #ffbbee); }
        .sparkle-particle-layer {
            position: fixed;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes fall{to{transform:translateY(100vh) rotate(360deg)}}
        @keyframes twinkle{from{opacity:0.2}to{opacity:0.95}}
        /* 移动端 */
        @media (max-width: 840px) {
            .content-container { flex-direction: column !important; }
            .left-sidebar-wrap { width: 100%; }
            .top-cat-banner { height: 320px; }
            .site-title-glitter { font-size: 48px; right: 10px; }
            .star-deco-left,.star-deco-right { font-size:22px; }
            .sticker-butterfly { width: 120px; }
            .sticker-heart { width:70px; }
            .gallery-header-block { flex-direction:column; gap:20px; text-align:center; }
            .gallery-main-title { font-size:36px; }
            .album-grid-wrap { grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); }
            .modal-inner { padding:24px 18px; }
        }
    </style>
</head>

    <script>
        // 固定你的Github信息
        const GITHUB_USER = "wanliu530";
        const GITHUB_REPO = "lenamirror";
        const GITHUB_BRANCH = "main";
        const MD_FOLDER = "content/gallery/";
        const albumGroups = ["Daily Life","Portrait","Liu Mi"];

        // DOM缓存
        const coverDaily = document.getElementById("cover-daily");
        const coverPortrait = document.getElementById("cover-portrait");
        const coverLiumi = document.getElementById("cover-liumi");
        const photoModal = document.getElementById("photoModal");
        const closeModal = document.getElementById("closeModal");
        const modalAlbumName = document.getElementById("modalAlbumName");
        const modalImage = document.getElementById("modalImage");
        const photoDesc = document.getElementById("photoDesc");
        const prevPhotoBtn = document.getElementById("prevPhotoBtn");
        const nextPhotoBtn = document.getElementById("nextPhotoBtn");
        const adminUploadBtn = document.getElementById("adminUploadBtn");
        const sendCommentBtn = document.getElementById("sendCommentBtn");
        const inputCommentName = document.getElementById("inputCommentName");
        const inputCommentText = document.getElementById("inputCommentText");
        const photoCommentList = document.getElementById("photoCommentList");
        const bgmBtn = document.getElementById("bgmBtn");
        const bgmAudio = document.getElementById("bgmAudio");

        let allPhotoData = [];
        let currentGroupImgs = [];
        let currentIdx = 0;

        // 跳转后台
        adminUploadBtn.addEventListener("click", ()=> window.open(`${location.origin}/admin`, "_blank"));

        // 【修复稳定解析函数】解决末尾字段读不到、路径自动转换
        function parseMarkdown(rawMd) {
            let title = "无描述";
            let albumCat = "";
            let imgPath = "";
            let dateStr = "";
            const fmReg = /^---([\s\S]*?)---/;
            const fmMatch = rawMd.match(fmReg);
            if (!fmMatch) return null;
            const fmText = fmMatch[1];
            const getValue = (key, text) => {
                const reg = new RegExp(`${key}:\\s*(.+?)(?=\\n[\\w_]+:|$)`,"s");
                const res = text.match(reg);
                return res ? res[1].trim() : "";
            };
            title = getValue("title", fmText);
            albumCat = getValue("album_category", fmText);
            imgPath = getValue("image", fmText);
            dateStr = getValue("date", fmText);
            // CMS输出 /uploads/ 转为网站真实目录 /assets/upload/
            if(imgPath){
                imgPath = imgPath.replace("/uploads/","/assets/upload/");
            }
            return { title, album: albumCat, img: imgPath, date: dateStr };
        }

        // 拉取所有相册md
        async function loadGalleryData() {
            try {
                const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${MD_FOLDER}?ref=${GITHUB_BRANCH}`;
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error("无相册文件");
                const fileList = await res.json();
                const tempArr = [];
                for (const file of fileList) {
                    if (!file.name.endsWith(".md")) continue;
                    const mdRaw = await (await fetch(file.download_url)).text();
                    const data = parseMarkdown(mdRaw);
                    if (data && data.img && data.album) tempArr.push(data);
                }
                // 日期倒序，最新在前做封面
                allPhotoData = tempArr.sort((a,b)=>new Date(b.date)-new Date(a.date));
                refreshCovers();
            } catch (err) {
                console.warn("相册数据加载失败：", err);
            }
        }

        // 刷新三个窗口封面
        function refreshCovers() {
            const daily = allPhotoData.filter(p=>p.album==="Daily Life");
            const portrait = allPhotoData.filter(p=>p.album==="Portrait");
            const liumi = allPhotoData.filter(p=>p.album==="Liu Mi");
            if(daily.length) coverDaily.src = daily[0].img;
            if(portrait.length) coverPortrait.src = portrait[0].img;
            if(liumi.length) coverLiumi.src = liumi[0].img;
        }

        // 打开指定相册
        function openAlbumByGroup(groupName) {
            currentGroupImgs = allPhotoData.filter(item=>item.album === groupName);
            if(currentGroupImgs.length === 0){
                alert("该相册暂无图片，请前往后台上传照片");
                return;
            }
            currentIdx = 0;
            modalAlbumName.innerText = groupName;
            renderCurrentPic();
            loadLocalComment();
            photoModal.classList.add("active");
        }

        // 页面加载立刻绑定点击（解决点不动）
        function bindAllWindowClick() {
            document.querySelectorAll(".album-window").forEach(win=>{
                win.onclick = function(){
                    openAlbumByGroup(this.dataset.group);
                }
            })
        }

        // 渲染当前大图
        function renderCurrentPic() {
            const pic = currentGroupImgs[currentIdx];
            modalImage.src = pic.img;
            photoDesc.innerText = pic.title;
        }

        // 切换图片
        prevPhotoBtn.onclick = ()=>{
            currentIdx = (currentIdx -1 + currentGroupImgs.length) % currentGroupImgs;
            renderCurrentPic(); loadLocalComment();
        };
        nextPhotoBtn.onclick = ()=>{
            currentIdx = (currentIdx +1) % currentGroupImgs.length;
            renderCurrentPic(); loadLocalComment();
        };
        // 关闭弹窗
        closeModal.onclick = ()=> photoModal.classList.remove("active");
        photoModal.onclick = (e)=>{if(e.target === photoModal) photoModal.classList.remove("active");};

        // 本地评论
        function getCommentKey(){
            const pic = currentGroupImgs[currentIdx];
            return `gallery_cmt_${pic.img.replace(/\W/g,"")}`;
        }
        function loadLocalComment(){
            const key = getCommentKey();
            const list = JSON.parse(localStorage.getItem(key) || "[]");
            if(list.length === 0){
                photoCommentList.innerHTML = `<div class="empty-comment-tip">暂无评论，快来留下第一条吧</div>`;
                return;
            }
            photoCommentList.innerHTML = "";
            list.forEach(item=>{
                const div = document.createElement("div");
                div.className = "comment-item";
                div.innerHTML = `
                    <div class="comment-author">${item.name}</div>
                    <div class="comment-content">${item.msg}</div>
                    <div class="comment-time">${item.time}</div>
                `;
                photoCommentList.appendChild(div);
            })
        }
        sendCommentBtn.onclick = ()=>{
            const name = inputCommentName.value.trim();
            const msg = inputCommentText.value.trim();
            if(!name || !msg) return alert("请填写昵称和评论");
            const now = new Date();
            const time = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${now.getMinutes()}`;
            const key = getCommentKey();
            const arr = JSON.parse(localStorage.getItem(key) || "[]");
            arr.unshift({name,msg,time});
            localStorage.setItem(key, JSON.stringify(arr));
            loadLocalComment();
            inputCommentName.value = "";
            inputCommentText.value = "";
        };

        // 底部时间
        function refreshTime(){
            const now = new Date();
            const weekCN = ["周日","周一","周二","周三","周四","周五","周六"];
            const weekEN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
            const monthEN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
            const y = now.getFullYear();
            const m = now.getMonth()+1;
            const d = now.getDate();
            const w = now.getDay();
            document.getElementById("timeDisplay").innerText = `${y}年${m}月${d} ${weekCN[w]} ${weekEN[w]} ${monthEN[now.getMonth()]} ${d}`;
        }
        refreshTime();
        setInterval(refreshTime, 1000);

        // 星光粒子
        const sparkleWrap = document.querySelector(".sparkle-particle-layer");
        function createSpark(){
            const size = Math.random()*14+4;
            const div = document.createElement("div");
            div.style.cssText = `position:absolute;width:${size}px;height:${size}px;left:${Math.random()*100}vw;top:-10px;background:radial-gradient(#fff,#ffd0f0,#e0b8ff);border-radius:50%;opacity:${Math.random()*0.65+0.2};animation:fall ${Math.random()*10+5}s linear forwards,twinkle 1s infinite alternate;`;
            sparkleWrap.appendChild(div);
            setTimeout(()=>div.remove(),15000);
        }
        setInterval(createSpark,180);
        const keyStyle = document.createElement("style");
        keyStyle.textContent = `@keyframes fall{to{transform:translateY(100vh) rotate(360deg)}}@keyframes twinkle{from{opacity:0.2}to{opacity:0.95}}`;
        document.head.appendChild(keyStyle);

        // BGM控制
        let musicPlay = true;
        bgmBtn.addEventListener("click", ()=>{
            if(musicPlay){ bgmAudio.pause(); musicPlay=false; bgmBtn.style.background="#ffd6ec"; }
            else { bgmAudio.play(); musicPlay=true; bgmBtn.style.background="#ffffff"; }
        });
        document.body.addEventListener("click", ()=>{
            bgmAudio.muted = false;
            bgmAudio.play();
        }, {once:true});

        // 页面初始化：先绑定点击，再异步加载图片数据
        window.addEventListener("DOMContentLoaded", async ()=>{
            bindAllWindowClick();
            await loadGalleryData();
        });
    </script>
</body>
</html>
