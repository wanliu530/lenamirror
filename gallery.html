<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✧⋆ Lena's Mirror Gallery ˚‧₊˚✧⋆</title>
    <style>
        /* ====================== 独立字体配置 和首页完全统一 ====================== */
        @font-face {
            font-family: "Font_Loading";
            src: url("assets/fonts/font_loading.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Nav";
            src: url("assets/fonts/font_nav.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Content_CN";
            src: url("assets/fonts/font_cn.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Font_Content_EN";
            src: url("assets/fonts/font_en.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Font_Content_CN", "Font_Content_EN", sans-serif;
            background: #ffd6e7;
            background-image: url("assets/bg_pattern.gif");
            color: #581845;
            overflow-x: hidden;
            cursor: url("assets/cursor/pinkheart.gif"), auto;
        }
        audio {display:none;}
        /* 页头区域 */
        .page-header {
            width: 100%;
            padding: 30px 0;
            text-align: center;
        }
        .header-top-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        .header-preview-img {
            height: 180px;
            border: 3px solid #ff77bb;
            border-radius: 12px;
        }
        .gallery-title {
            font-family: "Font_Loading";
            font-size: 42px;
            color: #c42e78;
        }
        .divider-gif {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            gap: 8px;
        }
        .divider-side { height: 40px; }
        .divider-center { height: 40px; }

        .main-wrap {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            gap: 30px;
            padding: 20px;
        }
        /* 侧边导航 圆角荧光边框 */
        .sidebar-nav {
            min-width: 220px;
            padding: 25px 16px;
            border: 2px solid #ff77cc;
            border-radius: 18px;
            box-shadow: 0 0 12px #ff88cc;
            background: #fff0f7;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 22px 0;
            font-family: "Font_Nav";
            font-size: 19px;
        }
        .nav-icon {
            width:22px;
        }
        .nav-item a {
            color:#992266;
            text-decoration:none;
        }
        .nav-item a:hover {
            color:#ff4499;
            text-shadow:0 0 6px #ff99cc;
        }

        /* 相册容器 */
        .album-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px,1fr));
            gap:26px;
            padding:10px;
        }
        .album-card {
            background:#fff3f9;
            border:2px solid #ff77bb;
            border-radius:14px;
            overflow:hidden;
            box-shadow: 0 0 8px #ffadd2;
            cursor:pointer;
            transition:0.25s;
        }
        .album-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 0 16px #ff77bb;
        }
        .album-cover {
            width:100%;
            height:180px;
            object-fit:cover;
        }
        .album-name {
            text-align:center;
            padding:10px;
            font-size:18px;
            font-weight:bold;
            color:#701e4e;
        }

        /* 图片弹窗 */
        .photo-modal {
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.65);
            z-index:999;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .modal-window {
            width:min(920px, 100%);
            background:#fff0f8;
            border-radius:16px;
            overflow:hidden;
            border:2px solid #ff77cc;
        }
        .modal-topbar {
            background: linear-gradient(90deg,#ffb8e0,#f7a0d8);
            padding:10px 16px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .modal-album-name {
            font-family:"Font_Loading";
            font-size:22px;
        }
        .close-modal {
            width:30px;
            height:30px;
            background:#ffdd44;
            border:none;
            border-radius:6px;
            font-weight:bold;
            cursor:pointer;
        }
        .modal-img-box {
            padding:16px;
            text-align:center;
        }
        .modal-photo {
            max-width:100%;
            max-height:520px;
            border-radius:8px;
        }
        .photo-desc {
            margin-top:10px;
            color:#662244;
        }
        .btn-group {
            display:flex;
            gap:14px;
            justify-content:center;
            margin:16px 0;
        }
        .photo-btn {
            padding:8px 22px;
            border:none;
            border-radius:30px;
            background:linear-gradient(90deg,#ffadd2,#e890d8);
            color:#441133;
            font-size:16px;
            cursor:pointer;
        }
        .comment-area {
            padding:16px;
        }
        .comment-input {
            width:100%;
            border:2px solid #ffb8dd;
            border-radius:10px;
            padding:10px;
            background:#fff8fc;
            margin:8px 0;
        }
        .send-comment-btn {
            display:block;
            margin-left:auto;
            padding:8px 24px;
            border:none;
            border-radius:20px;
            background:#f49cd2;
            cursor:pointer;
        }
        .comment-list {
            margin-top:12px;
            max-height:160px;
            overflow:auto;
        }

        /* 底部时间栏 */
        footer {
            width:100%;
            text-align:center;
            padding:30px 0;
            font-size:17px;
            margin-top:40px;
        }
    </style>
</head>
<body>
<audio id="bgmPlayer" loop preload="auto">
    <source src="assets/bgm/bgm.mp3" type="audio/mpeg">


<div class="page-header">
    <div class="header-top-wrap">
        <img class="header-preview-img" src="assets/gallery_header.png" alt="header">
        <h1 class="gallery-title">My Sweet Memories</h1>
    </div>
    <div class="divider-gif">
        <img class="divider-side" src="assets/gif/divider1.gif">
        <img class="divider-center" src="assets/gif/divider2.gif">
        <img class="divider-side" src="assets/gif/divider1.gif">
    </div>
</div>

<div class="main-wrap">
    <nav class="sidebar-nav">
        <div class="nav-item">
            <img class="nav-icon" src="assets/pixel/home.gif">
            <a href="index.html">首页</a>
        </div>
        <div class="nav-item">
            <img class="nav-icon" src="assets/pixel/journal.gif">
            <a href="journal.html">随笔</a>
        </div>
        <div class="nav-item">
            <img class="nav-icon" src="assets/pixel/gallery.gif">
            <a href="gallery.html">相册</a>
        </div>
        <div class="nav-item">
            <img class="nav-icon" src="assets/pixel/guest.gif">
            <a href="guestbook.html">留言板</a>
        </div>
    </nav>

    <div class="album-container" id="albumWrap">
        <!-- JS动态渲染相册卡片 -->
    </div>
</div>

<!-- 图片弹窗 -->
<div class="photo-modal" id="photoModal">
    <div class="modal-window">
        <div class="modal-topbar">
            <span class="modal-album-name" id="modalAlbumTitle"></span>
            <button class="close-modal" id="closeModal">✕</button>
        </div>
        <div class="modal-img-box">
            <img class="modal-photo" id="modalImage">
            <p class="photo-desc" id="photoDesc"></p>
        </div>
        <div class="btn-group">
            <button class="photo-btn" id="prevBtn">上一张</button>
            <button class="photo-btn" id="nextBtn">下一张</button>
        </div>
        <div class="comment-area">
            <input class="comment-input" id="nameInput" placeholder="你的昵称">
            <textarea class="comment-input" id="msgInput" rows="3" placeholder="写下对这张照片的评论..."></textarea>
            <button class="send-comment-btn" id="sendComment">发送评论</button>
            <div class="comment-list" id="commentList">暂无评论，快来留下第一条吧</div>
        </div>
    </div>
</div>

<footer>
    <span id="realTimeDate"></span>
</footer>

<script>
// ========== 全局变量 ==========
let galleryRawData = [];
const albumGroups = ["Daily Life","这是人","刘咪"];
let currentAlbumPhotos = [];
let currentPhotoIndex = 0;

// 1. 加载自动生成的相册数据源
async function loadGalleryData(){
    try{
        const res = await fetch("/gallery-data.json");
        galleryRawData = await res.json();
        renderAlbumCards();
    }catch(err){
        console.error("相册数据加载失败：",err);
        document.getElementById("albumWrap").innerHTML = "<p>相册加载失败，请稍后刷新</p>";
    }
}

// 2. 渲染相册窗口（每个相册取最新图片作为封面）
function renderAlbumCards(){
    const wrap = document.getElementById("albumWrap");
    wrap.innerHTML = "";
    albumGroups.forEach(groupName=>{
        const groupImages = galleryRawData.filter(item=>item.album === groupName);
        if(groupImages.length === 0) return;
        const newestPic = groupImages[0]; // 最新上传为封面

        const card = document.createElement("div");
        card.className = "album-card";
        card.innerHTML = `
            <img class="album-cover" src="${newestPic.image}" loading="lazy">
            <div class="album-name">${groupName}</div>
        `;
        card.onclick = ()=>openAlbum(groupName);
        wrap.appendChild(card);
    })
}

// 打开相册弹窗
function openAlbum(albumName){
    currentAlbumPhotos = galleryRawData.filter(item=>item.album === albumName);
    currentPhotoIndex = 0;
    document.getElementById("modalAlbumTitle").innerText = albumName;
    renderCurrentPhoto();
    document.getElementById("photoModal").style.display = "flex";
}

function renderCurrentPhoto(){
    const pic = currentAlbumPhotos[currentPhotoIndex];
    document.getElementById("modalImage").src = pic.image;
    document.getElementById("photoDesc").innerText = pic.desc;
}

// 切换图片
document.getElementById("prevBtn").onclick = ()=>{
    currentPhotoIndex = (currentPhotoIndex - 1 + currentAlbumPhotos.length) % currentAlbumPhotos.length;
    renderCurrentPhoto();
}
document.getElementById("nextBtn").onclick = ()=>{
    currentPhotoIndex = (currentPhotoIndex + 1) % currentAlbumPhotos.length;
    renderCurrentPhoto();
}
document.getElementById("closeModal").onclick = ()=>{
    document.getElementById("photoModal").style.display = "none";
}

// 简易本地评论（如需持久评论后续再扩展）
document.getElementById("sendComment").onclick = ()=>{
    const name = document.getElementById("nameInput").value.trim();
    const msg = document.getElementById("msgInput").value.trim();
    if(!name || !msg) return alert("请填写昵称和评论");
    const list = document.getElementById("commentList");
    list.innerHTML += `<p>【${name}】：${msg}</p>`;
    document.getElementById("msgInput").value = "";
}

// ========== 实时底部时间（和首页格式统一） ==========
function updateTime(){
    const now = new Date();
    const weekArr = ["周日","周一","周二","周三","周四","周五","周六"];
    const enWeek = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const year = now.getFullYear();
    const month = now.getMonth()+1;
    const day = now.getDate();
    const weekCn = weekArr[now.getDay()];
    const weekEn = enWeek[now.getDay()];
    const dateEn = now.toDateString();
    document.getElementById("realTimeDate").innerText = `${year}年${month}月${day}日 ${weekCn} ${weekEn} ${dateEn}`;
}
updateTime();
setInterval(updateTime,1000);

// 页面启动加载相册数据
loadGalleryData();
</script>
</body>
</html>
